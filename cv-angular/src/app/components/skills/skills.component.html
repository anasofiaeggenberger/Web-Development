<div class="seccion">
  <h3>Lenguajes de programación</h3>
  <div class="badges">
    <span class="badge text-bg-secondary">Python</span>
    <span class="badge text-bg-secondary">HTML</span>
    <span class="badge text-bg-secondary">C++</span>
  </div>
</div>

<div class="seccion">
  <h3>Soft Skills</h3>
  <input type="text" class="form-control mb-3" [(ngModel)]="filtro" placeholder="Buscar habilidad...">
  <div class="badges" id="listaHabilidades">
    <span class="badge text-bg-secondary" *ngFor="let h of habilidadesFiltradas">{{ h }}</span>
  </div>
</div>
